<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GroupDrive — учебное пространство</title>
<style>
:root{--bg:#080e1d;--panel:#101b31;--line:#263858;--text:#eff4ff;--muted:#93a7cc;--blue:#5060ff;--cyan:#5ad9f4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 60% -20%,#23386b,transparent 50%),var(--bg);color:var(--text);font:15px/1.45 Inter,"Segoe UI",Arial,sans-serif}.top{height:76px;display:flex;align-items:center;gap:22px;padding:0 26px;border-bottom:1px solid #1d2b48;background:#080f20eF;position:sticky;top:0;z-index:5;backdrop-filter:blur(15px)}.brand{font-size:26px;font-weight:800;white-space:nowrap;letter-spacing:-1px}.brand b{color:var(--cyan)}.cloud{color:#9b75ff;font-size:30px;margin-right:9px}.search{flex:1;max-width:720px}.search input{width:100%;padding:13px 18px;border:1px solid var(--line);border-radius:30px;background:#111e37;color:white;outline:none}.user{margin-left:auto;display:flex;align-items:center;gap:12px}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#9b60ff,#42d3e9);font-weight:bold}.muted,small{color:var(--muted)}button{cursor:pointer;font:inherit;color:inherit}.layout{max-width:1500px;margin:auto;padding:24px;display:grid;grid-template-columns:225px minmax(0,1fr);gap:24px}.side{display:flex;flex-direction:column;gap:7px}.nav{border:0;background:transparent;color:#b9c8e4;text-align:left;padding:13px 15px;border-radius:12px}.nav:hover,.nav.active{background:linear-gradient(110deg,#4b5fff,#704cff);color:white}.side-label{font-size:11px;letter-spacing:1.5px;color:#8499c3;margin:25px 12px 7px}.storage{margin-top:auto;border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:16px}.bar{height:7px;background:#223452;border-radius:10px;margin:12px 0}.bar i{display:block;width:24%;height:100%;border-radius:10px;background:linear-gradient(90deg,#5667ff,#5ad9f4)}main{min-width:0}.hero{padding:30px 32px;min-height:160px;border-radius:20px;background:radial-gradient(ellipse at 80% 20%,#e2a5ff88,transparent 25%),linear-gradient(115deg,#16447c,#343d9c 58%,#714cae);position:relative;overflow:hidden;margin-bottom:20px}.hero:after{content:"✦   ·    ✧    ·    ✦";position:absolute;right:24px;top:20px;color:#ffffffa0;font-size:24px;letter-spacing:8px}.hero h1{font-size:clamp(25px,3vw,35px);margin:0 0 8px}.hero p{margin:0;color:#e0e9ff}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0 28px}.btn{border:1px solid #2b3d60;border-radius:12px;background:#14213a;padding:11px 16px;font-weight:650}.btn.primary{background:linear-gradient(110deg,#4b5fff,#6b4fff);border-color:transparent}.btn:hover{filter:brightness(1.15)}.spacer{flex:1}.crumbs{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:-12px 2px 22px;color:var(--muted);font-size:13px}.crumbs button{border:0;background:none;color:#b8c8e6;padding:0}.head{display:flex;align-items:center;gap:12px;margin:0 2px 13px}.head h2{font-size:20px;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:13px}.card{position:relative;border:1px solid #233656;background:linear-gradient(145deg,#101d34,#0b1426);border-radius:15px;padding:16px;min-width:0;transition:.18s}.folder{cursor:pointer;min-height:140px}.card:hover{transform:translateY(-2px);border-color:#526ba6;box-shadow:0 12px 28px #0003}.foldericon{font-size:42px;margin-bottom:10px}.filename{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 0 6px}.meta{font-size:12px;color:var(--muted)}.fileicon{height:50px;width:43px;border-radius:7px;margin-bottom:12px;display:grid;place-items:center;background:linear-gradient(140deg,#ff7885,#d93255);font-size:11px;font-weight:900}.fileicon.doc{background:linear-gradient(140deg,#61b7ff,#315fed)}.fileicon.vid{background:linear-gradient(140deg,#c67cff,#7545ef)}.fileicon.img{background:linear-gradient(140deg,#4de1d5,#159cae)}.fileicon.zip{background:linear-gradient(140deg,#ffc66e,#e98529)}.actions{display:flex;gap:6px;margin-top:12px}.actions button{flex:1;padding:7px 8px;font-size:12px}.menu{position:absolute;right:9px;top:8px;border:0;background:transparent;color:#91a7d1;font-size:20px}.empty{grid-column:1/-1;border:1px dashed #2a3d61;border-radius:15px;padding:28px;text-align:center;color:var(--muted)}.empty b{display:block;color:#e4ecff;margin-bottom:5px}.notice{display:none;padding:12px 15px;border-radius:12px;margin-bottom:16px}.notice.show{display:block}.error{background:#441d2c;color:#ffd9e1}.success{background:#12382f;color:#c8ffed}.modalback{position:fixed;inset:0;background:#020612d9;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modalback.open{display:flex}.modal{width:min(650px,100%);background:#0e1930;border:1px solid #2b4169;border-radius:18px;padding:22px}.modal h2{margin:0 0 14px}.modal input{width:100%;padding:12px;border:1px solid #2b4169;border-radius:10px;background:#081226;color:white}.modal label{display:block;margin:12px 0 6px;color:#b6c7e8}.preview{height:min(65vh,650px);background:#080f20;border-radius:12px;overflow:hidden;display:grid;place-items:center}.preview iframe,.preview video,.preview img{width:100%;height:100%;border:0;object-fit:contain}.close{float:right;background:transparent;border:0;font-size:24px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}
@media(max-width:850px){.layout{grid-template-columns:1fr;padding:15px}.side{flex-direction:row;overflow:auto}.side-label,.storage{display:none}.nav{white-space:nowrap}.top{padding:0 14px;gap:12px}.brand{font-size:20px}.user .who{display:none}.hero{padding:24px}.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
</style></head>
<body>
<header class="top"><div class="brand"><span class="cloud">☁</span>Group<b>Drive</b></div><div class="search"><input id="search" placeholder="⌕  Поиск файлов и папок..."></div><div class="user"><div class="avatar" id="avatar">G</div><div class="who"><b id="userName">GroupDrive</b><br><small id="userRole">Учебное пространство</small></div><button class="btn" id="logout">Выйти</button></div></header>
<div class="layout"><aside class="side"><button class="nav active" id="myFiles">▣　Мои файлы</button><button class="nav" id="recent">◷　Последние файлы</button><a class="nav" id="reviewsLink" href="/reviews.html" style="text-decoration:none">✎　Проверка / оценки</a><a class="nav" id="adminLink" href="/admin.html" style="display:none;text-decoration:none">⚙　Администратор</a><div class="side-label">ПАПКИ</div><button class="nav" id="root">⌂　Все папки</button><div class="storage"><div>☁ Использовано места</div><div class="bar"><i></i></div><small>Ваше учебное пространство</small></div></aside>
<main><section class="hero"><h1>Твоё учебное пространство</h1><p>Загружай, храни и делись своими работами</p></section><div id="notice" class="notice"></div><div class="toolbar"><button class="btn primary" id="newFolder">＋ Создать папку</button><button class="btn" id="uploadBtn">↑ Загрузить файл</button><input type="file" id="fileInput" hidden><div class="spacer"></div><small id="counts"></small></div><div class="crumbs" id="crumbs"><button id="homeCrumb">Мои файлы</button></div><section><div class="head"><h2>Папки</h2><small id="folderCount"></small></div><div class="grid" id="folders"><div class="empty">Загружаем папки…</div></div></section><section style="margin-top:28px"><div class="head"><h2>Файлы</h2><small id="fileCount"></small></div><div class="grid" id="files"><div class="empty">Загружаем файлы…</div></div></section></main></div>
<div class="modalback" id="folderModal"><div class="modal"><button class="close" data-close="folderModal">×</button><h2>Создать папку</h2><label for="folderName">Название</label><input id="folderName" maxlength="120" placeholder="Например, Практические работы"><div class="modalactions"><button class="btn" data-close="folderModal">Отмена</button><button class="btn primary" id="saveFolder">Создать</button></div></div></div>
<div class="modalback" id="previewModal"><div class="modal"><button class="close" data-close="previewModal">×</button><h2 id="previewTitle">Предпросмотр</h2><div class="preview" id="previewBody"></div><div class="modalactions"><button class="btn" data-close="previewModal">Закрыть</button><a class="btn primary" id="downloadPreview" href="#">↓ Скачать</a></div></div></div>
<script>
(()=>{const $=id=>document.getElementById(id);let me=null,current=null,crumbs=[],folders=[],files=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>{n=Number(n)||0;return n<1024?n+' Б':n<1048576?(n/1024).toFixed(1)+' КБ':n<1073741824?(n/1048576).toFixed(1)+' МБ':(n/1073741824).toFixed(2)+' ГБ'};
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',...opts});const ct=r.headers.get('content-type')||'';const d=ct.includes('json')?await r.json():await r.text();if(!r.ok)throw Error(d?.error||d||'Ошибка '+r.status);return d}
function say(t,type='success'){$('notice').textContent=t;$('notice').className='notice show '+(type==='error'?'error':'success');setTimeout(()=>$('notice').className='notice',5000)}
async function init(){try{me=await api('/api/me');$('userName').textContent=me.name||me.email;$('userRole').textContent=me.role==='admin'?'Администратор':me.role==='teacher'?'Преподаватель':'Ученик';if(me.role==='admin')$('adminLink').style.display='block';$('reviewsLink').textContent=['teacher','admin'].includes(me.role)?'✎　Проверка работ':'✎　Мои оценки';$('avatar').textContent=(me.name||'G').trim()[0].toUpperCase();await load()}catch(e){$('folders').innerHTML='<div class="empty"><b>Не удалось подключиться</b>Проверь, что сервер запущен и ты вошёл в аккаунт.</div>';$('files').innerHTML='';say(e.message,'error');if(String(e.message).includes('Не авторизован'))setTimeout(()=>location.href='/login.html',1000)}}
async function load(){try{const [f,fi]=await Promise.all([api('/api/folders'+(current?'?parent='+encodeURIComponent(current):'')),api('/api/files'+(current?'?folder='+encodeURIComponent(current):''))]);folders=Array.isArray(f)?f:[];files=Array.isArray(fi)?fi:[];render()}catch(e){say('Ошибка загрузки: '+e.message,'error')}}
function render(){const q=$('search').value.toLowerCase().trim();const fs=folders.filter(f=>String(f.name).toLowerCase().includes(q));const fl=files.filter(f=>String(f.original_name).toLowerCase().includes(q));$('folderCount').textContent=fs.length?fs.length+' шт.':'';$('fileCount').textContent=fl.length?fl.length+' шт.':'';$('counts').textContent=fl.length+' файлов';
$('crumbs').innerHTML='<button id="homeCrumb">Мои файлы</button>'+crumbs.map((c,i)=>' › <button data-crumb="'+i+'">'+esc(c.name)+'</button>').join('');$('homeCrumb').onclick=()=>{current=null;crumbs=[];load()};document.querySelectorAll('[data-crumb]').forEach(b=>b.onclick=()=>{crumbs=crumbs.slice(0,Number(b.dataset.crumb)+1);current=crumbs[crumbs.length-1]?.id||null;load()});
$('folders').innerHTML=fs.length?fs.map(f=>`<article class="card folder" data-open="${f.id}"><button class="menu" data-fdel="${f.id}" title="Удалить">⋮</button><div class="foldericon">📁</div><div class="filename">${esc(f.name)}</div><div class="meta">Открыть папку</div></article>`).join(''):'<div class="empty"><b>Пока нет папок</b>Создай папку для своих работ.</div>';
document.querySelectorAll('[data-open]').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-fdel]'))return;const f=fs.find(x=>String(x.id)===el.dataset.open);current=f.id;crumbs.push({id:f.id,name:f.name});load()});document.querySelectorAll('[data-fdel]').forEach(b=>b.onclick=async e=>{e.stopPropagation();if(!confirm('Удалить папку?'))return;try{await api('/api/folders/'+b.dataset.fdel,{method:'DELETE'});say('Папка удалена');load()}catch(e){say(e.message,'error')}});
$('files').innerHTML=fl.length?fl.map(f=>{const n=String(f.original_name||'Файл'),ext=n.split('.').pop().toLowerCase(),kind=['mp4','webm','ogg','mov'].includes(ext)?'vid':['doc','docx','odt','txt'].includes(ext)?'doc':['png','jpg','jpeg','gif','webp'].includes(ext)?'img':['zip','rar','7z'].includes(ext)?'zip':'';const icon=kind==='vid'?'▶ VIDEO':kind==='doc'?'DOCX':kind==='img'?'IMG':kind==='zip'?'ZIP':ext.toUpperCase();const owner=f.owner_name?`<div class="meta">Автор: ${esc(f.owner_name)}</div>`:'';const permission=['teacher','admin'].includes(me.role)?`<button class="btn" data-perm="${f.id}" data-allow="${f.can_download?0:1}">${f.can_download?'Запретить ↓':'Разрешить ↓'}</button>`:'';return `<article class="card"><button class="menu" data-del="${f.id}" title="Удалить">⋮</button><div class="fileicon ${kind}">${esc(icon)}</div><div class="filename" title="${esc(n)}">${esc(n)}</div><div class="meta">${fmt(f.size)} · ${f.can_download?'скачивание разрешено':'без скачивания'}</div>${owner}<div class="actions"><button class="btn" data-prev="${f.id}">Просмотр</button><button class="btn" data-down="${f.id}" ${!f.can_download&& !['teacher','admin'].includes(me.role)?'disabled title="Скачивание запрещено"':''}>↓</button></div><div class="actions"><button class="btn" data-share="${f.id}">Поделиться ссылкой</button>${permission}</div></article>`}).join(''):'<div class="empty"><b>Файлов пока нет</b>Нажми «Загрузить файл», чтобы добавить работу.</div>';
document.querySelectorAll('[data-prev]').forEach(b=>b.onclick=()=>preview(fl.find(f=>String(f.id)===b.dataset.prev)));document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{if(b.disabled)return;location.href='/api/files/'+b.dataset.down+'/download'});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Удалить файл?'))return;try{await api('/api/files/'+b.dataset.del,{method:'DELETE'});say('Файл удалён');load()}catch(e){say(e.message,'error')}});document.querySelectorAll('[data-share]').forEach(b=>b.onclick=async()=>{const f=fl.find(x=>String(x.id)===b.dataset.share);const allow=!!f.can_download&&confirm('Разрешить скачивание по этой ссылке? Нажми «Отмена», чтобы разрешить только просмотр.');try{const d=await api('/api/share/'+b.dataset.share,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({allow_download:allow})});await navigator.clipboard.writeText(d.url).catch(()=>{});prompt('Ссылка на файл (скопируй и отправь нужному человеку):',d.url);say(d.allow_download?'Ссылка создана со скачиванием':'Ссылка создана без скачивания')}catch(e){say(e.message,'error')}});document.querySelectorAll('[data-perm]').forEach(b=>b.onclick=async()=>{try{const allowed=b.dataset.allow==='1';await api('/api/files/'+b.dataset.perm+'/permissions',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({can_download:allowed})});say(allowed?'Скачивание разрешено':'Скачивание запрещено');load()}catch(e){say(e.message,'error')}})}
function preview(f){if(!f)return;const url='/api/files/'+f.id+'/download?inline=1',ext=(f.original_name||'').split('.').pop().toLowerCase();$('previewTitle').textContent=f.original_name;$('downloadPreview').href='/api/files/'+f.id+'/download';$('downloadPreview').style.display=f.can_download||['teacher','admin'].includes(me.role)?'inline-flex':'none';const b=$('previewBody');if(['png','jpg','jpeg','gif','webp','svg'].includes(ext))b.innerHTML=`<img src="${url}" alt="${esc(f.original_name)}">`;else if(['mp4','webm','ogg'].includes(ext))b.innerHTML=`<video controls playsinline src="${url}"></video>`;else if(ext==='pdf')b.innerHTML=`<iframe src="${url}" title="PDF"></iframe>`;else b.innerHTML='<div class="empty"><b>Предпросмотр недоступен для этого формата</b>Скачай файл и открой в подходящей программе.</div>';$('previewModal').classList.add('open')}
$('newFolder').onclick=()=>{$('folderName').value='';$('folderModal').classList.add('open');$('folderName').focus()};$('saveFolder').onclick=async()=>{const name=$('folderName').value.trim();if(!name)return say('Введи название папки','error');try{await api('/api/folders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,parent_id:current})});$('folderModal').classList.remove('open');say('Папка создана');load()}catch(e){say(e.message,'error')}};
$('uploadBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async()=>{const file=$('fileInput').files[0];if(!file)return;const fd=new FormData();fd.append('file',file);if(current)fd.append('folder_id',current);try{await api('/api/upload',{method:'POST',body:fd});say('Файл загружен');load()}catch(e){say('Ошибка загрузки: '+e.message,'error')}finally{$('fileInput').value=''}};
$('search').oninput=render;$('logout').onclick=async()=>{try{await api('/api/logout',{method:'POST'})}finally{location.href='/login.html'}};$('root').onclick=()=>{current=null;crumbs=[];load()};$('myFiles').onclick=()=>{current=null;crumbs=[];load()};$('recent').onclick=()=>{files.sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));render()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$ (b.dataset.close).classList.remove('open'));document.querySelectorAll('.modalback').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modalback.open').forEach(m=>m.classList.remove('open'))});init();
})();
</script></body></html>
