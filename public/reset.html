<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GroupDrive — новый пароль</title><style>:root{color-scheme:dark;--line:#293d61;--muted:#93a7cc}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 15% 0%,#24386c80,transparent 36%),#080e1d;color:#eff4ff;font:15px/1.5 Inter,"Segoe UI",Arial,sans-serif}.box{width:min(480px,100%);padding:30px;background:#0b1427;border:1px solid #27395b;border-radius:22px;box-shadow:0 25px 70px #0005}.brand{font-size:25px;font-weight:850;margin-bottom:26px}.brand b{color:#5ad9f4}h1{font-size:28px;margin:0 0 8px}p{color:var(--muted)}label{display:block;margin:15px 0 7px;color:#c7d4ee}input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:#0a1428;color:white;font:inherit}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:11px;background:linear-gradient(110deg,#4d60ff,#7650ff);color:white;font:inherit;font-weight:750;cursor:pointer}.notice{display:none;padding:12px;border-radius:10px;margin:12px 0}.notice.show{display:block}.notice.error{background:#441d2c;color:#ffd9e1}.notice.success{background:#12382f;color:#c8ffed}.hidden{display:none!important}a{color:#a8c4ff}</style></head><body><main class="box"><div class="brand">☁ Group<b>Drive</b></div><h1>Создать новый пароль</h1><p>Придумай пароль длиной не менее 8 символов. Ссылка для сброса действует один час.</p><div id="notice" class="notice"></div><form id="form"><label for="password">Новый пароль</label><input id="password" type="password" minlength="8" required autocomplete="new-password" placeholder="Не менее 8 символов"><label for="again">Повтори пароль</label><input id="again" type="password" minlength="8" required autocomplete="new-password" placeholder="Повтори новый пароль"><button id="save">Сохранить пароль</button></form><p><a href="/login.html">Вернуться ко входу</a></p></main><script>(()=>{const $=id=>document.getElementById(id);const token=new URLSearchParams(location.search).get('token')||'';function say(t,e=false){$('notice').textContent=t;$('notice').className='notice show '+(e?'error':'success')}if(!token){say('В ссылке отсутствует токен. Запроси восстановление ещё раз.',true);$('save').disabled=true}$('form').onsubmit=async e=>{e.preventDefault();if($('password').value!==$('again').value){say('Пароли не совпадают.',true);return}const b=$('save');b.disabled=true;b.textContent='Сохраняем…';try{const r=await fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:$('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Не удалось изменить пароль');say(d.message||'Пароль изменён.');$('form').classList.add('hidden');setTimeout(()=>location.href='/login.html',1300)}catch(err){say(err.message,true)}finally{b.disabled=false;b.textContent='Сохранить пароль'}}})();</script></body></html>
